<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>My To-Do List</h1>
        </header>
        <main>
            <!-- Task Creation Form -->
            <form id="todoForm">
                <label for="taskInput" class="sr-only">Add a new task</label>
                <input type="text" id="taskInput" placeholder="What needs to be done?" requiredautocomplete="off">
                <button type="submit" id="addBtn">Add Task</button>
            </form>

            <!-- Task List Container -->
            <div class="todo-list-container">
                <ul id="taskList">
                    <!-- Tasks will be dynamically injected here -->
                </ul>
            </div>

            <!-- Application Controls -->
            <div class="controls">
                <span id="taskCounter">0 tasks remaining</span>
                <div class="filters" aria-label="Filter tasks">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
            </div>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
